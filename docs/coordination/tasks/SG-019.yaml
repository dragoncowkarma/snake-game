    until the 10-second poll timeout.
  reproduction: >-
    The full Pages-base suite failed on its first test. The exact same SHA and base
    path rerun with --grep "Keyboard Controls, WASD, Space" passed 1/1 in 14.7s.
    Root-base clean npm run verify also passed the same test in its 16/16 run.
  hypothesis: >-
    The test waits only for the first ArrowDown scroll event before capturing
    prevScrollY and sending Space, so browser keyboard-scroll animation/focus timing
    can leave no observable additional delta. Product command/default-prevention
    behavior is unchanged.
  independent_review_observation: >-
    Claude later observed a different deterministic E2E failure at
    production.spec.ts:661: both base 74fe266 and implementation 583c734 remained in
    Playing with Score 0 while the runner logged CVDisplayLinkCreateWithCGDisplay
    CVReturn -6670. That proves the game-loop freeze is a detached-macOS harness
    issue, not an SG-019 regression.
  causal_scope: >-
    The line 661 CVDisplayLink reproduction and the original line 266 scrollY
    observation are recorded as distinct symptoms. No evidence yet demonstrates
    that CVDisplayLink caused the scrollY 40-to-40 failure.
  acceptance: >-
    Without waitForTimeout, sleep, retries, force, or weakened assertions, make the
    pre-Space scroll baseline event-driven and stable; then pass the full Pages-base
    16-test suite three consecutive times and retain root-base behavior.
  suggested_owner_action: >-
    Reproduce the first failing assertion on a display-backed runner. For line 266,
    reset to a deterministic scroll position and await an event-driven
    scrollend/stable-frame boundary while continuing to prove physical scroll and
    preventDefault=false. For line 661, validate an active display/CVDisplayLink or
