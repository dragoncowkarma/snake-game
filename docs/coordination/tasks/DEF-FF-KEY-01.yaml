defect_context:
  origin_handoff: docs/coordination/handoffs/SG-020.md
  origin_lines: "38, 63-64, 70, 74"
  root_cause: >-
    Firefox Juggler keyboard IPC round-trip latency is systematically larger
    than Chromium's, so eight consecutive `page.keyboard.press()` calls span
    more real time than the 160ms sim tick and an extra tick is silently
    consumed between presses. The two tests were written assuming Chromium-like
    sub-tick timing, so extra ticks change the recorded direction and the
    scroll/mute assertions fail deterministically (3/3 on Firefox, 5/5 pass on
    Chromium warm reruns).
  product_impact: >-
    None. Repeated Chromium 5-viewport reruns and manual play sessions have
    produced no user-visible input regression. This is a test-harness defect,
    not a product defect. `production.spec.ts`'s intent (native key handling
    parity + preventDefault scroll behavior) is unchanged; only the harness must
    stop assuming a specific IPC latency ceiling.
severity: high
release_blocker_for:
